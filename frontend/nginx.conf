# Servidor de la SPA de SIHA-IA: fallback de rutas del cliente y proxy al API Gateway.
server {
    listen       80;
    server_name  localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # Compresión de los recursos estáticos.
    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # Recursos con hash en el nombre: caché agresiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reenvío al API Gateway (Ocelot). Permite usar VITE_API_URL vacío (rutas relativas).
    location /api/ {
        # Carga de PDF: Nginx limita el cuerpo a 1 MB por defecto y respondería 413 antes de llegar
        # al Microservicio B. Se deja margen sobre el máximo de la aplicación (10 MiB), que es quien
        # rechaza con un mensaje claro.
        client_max_body_size 12m;
        proxy_pass         http://siha-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Fallback de la SPA: cualquier ruta del cliente devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
