name: CI

# Integración continua del SIHA-IA (Sprint 1).
#
# Se separan explícitamente tres niveles de prueba para que la evidencia no mezcle simulaciones
# con infraestructura real:
#   1. unitarias      -> Siha.MsA.Tests y Siha.MsB.Tests (EF Core InMemory, mocks, inspección de configuración).
#   2. integracion    -> Siha.Integracion.Tests con SQL Server 2022 y RabbitMQ 3.13 REALES (Testcontainers).
#   3. e2e-compose    -> docker compose desde cero (SQL A/B, RabbitMQ, ms-a, ms-b, gateway, frontend)
#                        con caída/recuperación del bus; publica la evidencia como artefacto.
on:
  push:
    branches: [ main, master, develop, "feature/**", "sprint*" ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  unitarias:
    name: 1 · Build + pruebas unitarias (simuladas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Caché de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar dependencias
        run: dotnet restore SIHA-IA.sln

      - name: Compilar la solución
        run: dotnet build SIHA-IA.sln --no-restore --configuration Release

      - name: Pruebas unitarias MsA (simuladas)
        run: dotnet test tests/Siha.MsA.Tests/Siha.MsA.Tests.csproj --no-build -c Release --logger "trx;LogFileName=unitarias-msa.trx" --results-directory ./TestResults

      - name: Pruebas unitarias MsB (simuladas)
        run: dotnet test tests/Siha.MsB.Tests/Siha.MsB.Tests.csproj --no-build -c Release --logger "trx;LogFileName=unitarias-msb.trx" --results-directory ./TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-unitarias
          path: ./TestResults
          if-no-files-found: ignore

  frontend:
    name: 1b · Build del frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  integracion:
    name: 2 · Integración con SQL Server y RabbitMQ reales
    runs-on: ubuntu-latest
    needs: unitarias
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Caché de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Testcontainers levanta SQL Server 2022 y RabbitMQ 3.13 en el Docker del runner.
      - name: Pruebas de integración (infraestructura real)
        run: dotnet test tests/Siha.Integracion.Tests/Siha.Integracion.Tests.csproj -c Release --logger "trx;LogFileName=integracion-real.trx" --logger "console;verbosity=normal" --results-directory ./TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-integracion-real
          path: ./TestResults
          if-no-files-found: ignore

  e2e-compose:
    name: 3 · E2E Docker Compose desde cero
    runs-on: ubuntu-latest
    needs: [ unitarias, frontend ]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Recorrido completo (migraciones, Gateway, PDF, RabbitMQ, caída y recuperación del bus)
        run: bash scripts/e2e-docker-compose.sh

      - name: Logs de los contenedores (si falla)
        if: failure()
        run: docker compose logs --no-color > docs/evidencias/compose-logs.txt 2>&1 || true

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-e2e-compose
          path: docs/evidencias
          if-no-files-found: ignore
