name: siha-ia

services:
  # ==========================================================================
  # Bases de datos aisladas (arquitectura distribuida del SIHA-IA)
  # ==========================================================================
  sqlserver-a:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: siha-sqlserver-a
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SIHA_SQL_PASSWORD:?Configura SIHA_SQL_PASSWORD en .env}"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - siha-sqla:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [ siha ]

  sqlserver-b:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: siha-sqlserver-b
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SIHA_SQL_PASSWORD:?Configura SIHA_SQL_PASSWORD en .env}"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - siha-sqlb:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [ siha ]

  # DB C se provisiona para el Microservicio C (Sprint 2/3). Se activa con:
  #   docker compose --profile sprint23 up -d
  sqlserver-c:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: siha-sqlserver-c
    profiles: [ "sprint23" ]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SIHA_SQL_PASSWORD:?Configura SIHA_SQL_PASSWORD en .env}"
      MSSQL_PID: "Developer"
    ports:
      - "14331:1433"
    volumes:
      - siha-sqlc:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [ siha ]

  # Agente IA local del Microservicio C (S2-S01). Descarga al primer arranque el modelo de lenguaje
  # (análisis y OCR asistido) y el de embeddings (similitud de contenidos, US-10). Los modelos quedan
  # en el volumen siha-ollama, así que las siguientes veces arranca sin descargar nada.
  #   docker compose --profile sprint23 up -d
  ollama:
    image: ollama/ollama:0.3.14
    container_name: siha-ollama
    profiles: [ "sprint23" ]
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        rm -f /tmp/modelos-listos
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$${SIHA_OLLAMA_MODELO}" && ollama pull "$${SIHA_OLLAMA_MODELO_EMBEDDINGS}" && touch /tmp/modelos-listos
        wait
    environment:
      SIHA_OLLAMA_MODELO: "${SIHA_OLLAMA_MODELO:-llama3.2:3b}"
      SIHA_OLLAMA_MODELO_EMBEDDINGS: "${SIHA_OLLAMA_MODELO_EMBEDDINGS:-nomic-embed-text}"
      OLLAMA_KEEP_ALIVE: "10m"
    volumes:
      - siha-ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      # Sano solo cuando los dos modelos terminaron de descargarse.
      test: [ "CMD-SHELL", "test -f /tmp/modelos-listos" ]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 60s
    networks: [ siha ]

  # ==========================================================================
  # Bus de eventos (US-06)
  # ==========================================================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: siha-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "siha"
      RABBITMQ_DEFAULT_PASS: "${SIHA_RABBITMQ_PASSWORD:?Configura SIHA_RABBITMQ_PASSWORD en .env}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - siha-rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [ siha ]

  # ==========================================================================
  # Microservicios
  # ==========================================================================
  ms-a:
    build:
      context: .
      dockerfile: src/Services/Siha.MsA.Api/Dockerfile
    container_name: siha-ms-a
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__SihaDbA: "Server=sqlserver-a,1433;Database=SihaDbA;User Id=sa;Password=${SIHA_SQL_PASSWORD:?Configura SIHA_SQL_PASSWORD en .env};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "${SIHA_JWT_KEY:?Configura SIHA_JWT_KEY en .env}"
      Jwt__Issuer: "SIHA-IA"
      Jwt__Audience: "SIHA-IA-Clients"
      Seed__AdminCorreo: "admin@uta.edu.ec"
      Seed__AdminPassword: "${SIHA_ADMIN_PASSWORD:?Configura SIHA_ADMIN_PASSWORD en .env}"
      # Docentes revisores de los certificados de ejemplo (hnaranjo, mvaca, jcastro @uta.edu.ec).
      # Sin SIHA_DOCENTE_PASSWORD usan la misma contraseña del administrador.
      Seed__DocentePassword: "${SIHA_DOCENTE_PASSWORD:-${SIHA_ADMIN_PASSWORD}}"
      # Kestrel atiende REST (HTTP/1.1) en 8080 y gRPC (HTTP/2, h2c) en el listener dedicado 8081.
      Grpc__Puerto: "8081"
    depends_on:
      sqlserver-a:
        condition: service_healthy
    ports:
      - "5081:8080"   # API REST vía gateway
      - "5083:8081"   # servicio gRPC (siha.reglas.v1.ReglasGrpc)
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [ siha ]

  ms-b:
    build:
      context: .
      dockerfile: src/Services/Siha.MsB.Api/Dockerfile
    container_name: siha-ms-b
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__SihaDbB: "Server=sqlserver-b,1433;Database=SihaDbB;User Id=sa;Password=${SIHA_SQL_PASSWORD:?Configura SIHA_SQL_PASSWORD en .env};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "${SIHA_JWT_KEY:?Configura SIHA_JWT_KEY en .env}"
      Jwt__Issuer: "SIHA-IA"
      Jwt__Audience: "SIHA-IA-Clients"
      RabbitMq__Uri: "rabbitmq://rabbitmq"
      RabbitMq__Usuario: "siha"
      RabbitMq__Password: "${SIHA_RABBITMQ_PASSWORD:?Configura SIHA_RABBITMQ_PASSWORD en .env}"
      # Archivos (S1-S05 / S1-S06): tamaño máximo admitido y directorio de almacenamiento seguro.
      Archivos__TamanoMaximoBytes: "10485760"
      Archivos__RutaAlmacenamiento: "/app/archivos"
      Archivos__MinimoDocumentosRequeridos: "1"
      # Reintento automático de publicaciones tras una caída de RabbitMQ (conserva el CorrelationId).
      Republicacion__Habilitada: "true"
      Republicacion__IntervaloSegundos: "10"
      # gRPC de MS A para verificar que los docentes revisores del certificado existen con rol DOCENTE.
      CatalogoGrpc__Url: "http://ms-a:8081"
    volumes:
      - siha-archivos:/app/archivos
    depends_on:
      sqlserver-b:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-a:
        condition: service_healthy
    ports:
      - "5082:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [ siha ]

  ms-c:
    build:
      context: .
      dockerfile: src/Services/Siha.MsC.Api/Dockerfile
    container_name: siha-ms-c
    profiles: [ "sprint23" ]
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # appsettings.json fija Urls=localhost:5084 para desarrollo local; dentro del contenedor
      # debe escuchar en todas las interfaces para que el mapeo 5084:8080 y el healthcheck funcionen.
      Urls: "http://+:8080"
      ConnectionStrings__SihaDbC: "Server=sqlserver-c,1433;Database=SihaDbC;User Id=sa;Password=${SIHA_SQL_PASSWORD:?Configura SIHA_SQL_PASSWORD en .env};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Uri: "rabbitmq://rabbitmq"
      RabbitMq__Usuario: "siha"
      RabbitMq__Password: "${SIHA_RABBITMQ_PASSWORD:?Configura SIHA_RABBITMQ_PASSWORD en .env}"
      Jwt__Key: "${SIHA_JWT_KEY:?Configura SIHA_JWT_KEY en .env}"
      Jwt__Issuer: "SIHA-IA"
      Jwt__Audience: "SIHA-IA-Clients"
      # Mismo volumen que ms-b: los PDF se leen del disco compartido, no por HTTP.
      Archivos__RutaAlmacenamiento: "/app/archivos"
      ReglasGrpc__Url: "http://ms-a:8081"
      # Agente IA local (S2-S01): mismo modelo que descarga el servicio ollama.
      Ollama__Url: "http://ollama:11434"
      Ollama__Modelo: "${SIHA_OLLAMA_MODELO:-llama3.2:3b}"
      Ollama__ModeloEmbeddings: "${SIHA_OLLAMA_MODELO_EMBEDDINGS:-nomic-embed-text}"
      Ollama__TimeoutSegundos: "120"
    volumes:
      - siha-archivos:/app/archivos
    depends_on:
      # service_started: el consumidor y la confirmación de extracciones no esperan la descarga
      # de los modelos; el análisis con IA comprueba que Ollama esté listo antes de usarlo.
      ollama:
        condition: service_started
      sqlserver-c:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-a:
        condition: service_healthy
    ports:
      - "5084:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [ siha ]

  gateway:
    build:
      context: .
      dockerfile: src/Services/Siha.Gateway/Dockerfile
    container_name: siha-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Jwt__Key: "${SIHA_JWT_KEY:?Configura SIHA_JWT_KEY en .env}"
      Jwt__Issuer: "SIHA-IA"
      Jwt__Audience: "SIHA-IA-Clients"
    depends_on:
      ms-a:
        condition: service_healthy
      ms-b:
        condition: service_healthy
    ports:
      - "5000:8080"
    networks: [ siha ]

  # ==========================================================================
  # Frontend SPA (React 18 + Vite + TypeScript) servida por Nginx (tareas S1-A*)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vacío => la SPA consume rutas relativas /api/... y Nginx las reenvía
        # al API Gateway dentro de la red interna (sin CORS ni IPs fijas).
        VITE_API_URL: ""
    container_name: siha-frontend
    depends_on:
      - gateway
    ports:
      - "5173:80"
    networks: [ siha ]

volumes:
  siha-sqla:
  siha-sqlb:
  siha-sqlc:
  siha-rabbit:
  siha-archivos:
  siha-ollama:

networks:
  siha:
    driver: bridge
