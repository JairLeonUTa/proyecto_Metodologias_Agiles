name: siha-ia

services:
  # ==========================================================================
  # Bases de datos aisladas (arquitectura distribuida del SIHA-IA)
  # ==========================================================================
  sqlserver-a:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: siha-sqlserver-a
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SihaAdmin2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - siha-sqla:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [ siha ]

  sqlserver-b:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: siha-sqlserver-b
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SihaAdmin2026!"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - siha-sqlb:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [ siha ]

  # DB C se provisiona para el Microservicio C (Sprint 2/3). Se activa con:
  #   docker compose --profile sprint23 up -d
  sqlserver-c:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: siha-sqlserver-c
    profiles: [ "sprint23" ]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SihaAdmin2026!"
      MSSQL_PID: "Developer"
    ports:
      - "14331:1433"
    volumes:
      - siha-sqlc:/var/opt/mssql
    networks: [ siha ]

  # ==========================================================================
  # Bus de eventos (US-06)
  # ==========================================================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: siha-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "siha"
      RABBITMQ_DEFAULT_PASS: "siha-rabbit-2026"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - siha-rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [ siha ]

  # ==========================================================================
  # Microservicios
  # ==========================================================================
  ms-a:
    build:
      context: .
      dockerfile: src/Services/Siha.MsA.Api/Dockerfile
    container_name: siha-ms-a
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__SihaDbA: "Server=sqlserver-a,1433;Database=SihaDbA;User Id=sa;Password=SihaAdmin2026!;TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "SIHA-IA-clave-de-firma-JWT-para-el-Sprint-1-2026-256bits"
      Jwt__Issuer: "SIHA-IA"
      Jwt__Audience: "SIHA-IA-Clients"
      Seed__AdminCorreo: "admin@uta.edu.ec"
      Seed__AdminPassword: "Admin123*"
      # Kestrel atiende REST (HTTP/1.1) en 8080 y gRPC (HTTP/2, h2c) en el listener dedicado 8081.
      Grpc__Puerto: "8081"
    depends_on:
      sqlserver-a:
        condition: service_healthy
    ports:
      - "5081:8080"   # API REST vía gateway
      - "5083:8081"   # servicio gRPC (siha.reglas.v1.ReglasGrpc)
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [ siha ]

  ms-b:
    build:
      context: .
      dockerfile: src/Services/Siha.MsB.Api/Dockerfile
    container_name: siha-ms-b
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__SihaDbB: "Server=sqlserver-b,1433;Database=SihaDbB;User Id=sa;Password=SihaAdmin2026!;TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "SIHA-IA-clave-de-firma-JWT-para-el-Sprint-1-2026-256bits"
      Jwt__Issuer: "SIHA-IA"
      Jwt__Audience: "SIHA-IA-Clients"
      RabbitMq__Uri: "rabbitmq://rabbitmq"
      RabbitMq__Usuario: "siha"
      RabbitMq__Password: "siha-rabbit-2026"
      # Archivos (S1-S05 / S1-S06): tamaño máximo admitido y directorio de almacenamiento seguro.
      Archivos__TamanoMaximoBytes: "10485760"
      Archivos__RutaAlmacenamiento: "/app/archivos"
    volumes:
      - siha-archivos:/app/archivos
    depends_on:
      sqlserver-b:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5082:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [ siha ]

  gateway:
    build:
      context: .
      dockerfile: src/Services/Siha.Gateway/Dockerfile
    container_name: siha-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Jwt__Key: "SIHA-IA-clave-de-firma-JWT-para-el-Sprint-1-2026-256bits"
      Jwt__Issuer: "SIHA-IA"
      Jwt__Audience: "SIHA-IA-Clients"
    depends_on:
      ms-a:
        condition: service_healthy
      ms-b:
        condition: service_healthy
    ports:
      - "5000:8080"
    networks: [ siha ]

  # ==========================================================================
  # Frontend SPA (React 18 + Vite + TypeScript) servida por Nginx (tareas S1-A*)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vacío => la SPA consume rutas relativas /api/... y Nginx las reenvía
        # al API Gateway dentro de la red interna (sin CORS ni IPs fijas).
        VITE_API_URL: ""
    container_name: siha-frontend
    depends_on:
      - gateway
    ports:
      - "5173:80"
    networks: [ siha ]

volumes:
  siha-sqla:
  siha-sqlb:
  siha-sqlc:
  siha-rabbit:
  siha-archivos:

networks:
  siha:
    driver: bridge
